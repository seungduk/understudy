name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./... && go vet -tags e2e ./e2e
      - name: test
        run: go test -race -count=1 ./...
      - name: e2e compiles
        run: go test -tags e2e -count=1 -run XXX ./e2e
