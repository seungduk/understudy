name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./... && go vet -tags e2e ./e2e
      - name: test
        run: go test -race -count=1 ./...
      - name: e2e compiles
        run: go test -tags e2e -count=1 -run XXX ./e2e
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install
        run: npm ci
      - name: type-check
        run: npm run check
      - name: build
        run: npm run build
      - name: the committed build matches the sources
        run: |
          git diff --exit-code -- dist || {
            echo "ui/dist differs from a fresh build of ui/web. Fix: cd ui && npm ci && npm run build, then commit ui/dist"
            exit 1
          }
